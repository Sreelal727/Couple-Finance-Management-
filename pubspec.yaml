name: duo_finance
description: "Local-first couple finance tracker. Data lives on your phones and syncs directly between them."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # State & utils
  provider: ^6.1.5
  intl: ^0.20.3
  uuid: ^4.6.0
  collection: ^1.19.1
  path: ^1.9.1
  crypto: ^3.0.7

  # Storage
  sqflite: ^2.4.4
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

  # Sync (LAN + file bundle)
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  cryptography: ^2.9.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.1
  share_plus: ^13.3.0
  file_picker: ^12.3.0

  # Device features
  local_auth: ^3.0.2
  image_picker: ^1.2.3
  receive_sharing_intent: ^1.9.0
  flutter_local_notifications: ^22.3.0
  another_telephony: ^0.4.1
  permission_handler: ^13.0.2
  quick_actions: ^1.1.1

  # Reports
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
